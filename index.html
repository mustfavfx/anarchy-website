    <script>
      // Automatically unregister service workers in development to prevent caching issues
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
              registration.unregister().then(function(wasUnregistered) {
                if (wasUnregistered) {
                  console.log('[Dev SW] Unregistered active service worker successfully');
                  window.location.reload();
                }
              });
            }
          });
        }
    </script>
    <script>
      // Disable right-click context menu (only in production)
      document.addEventListener('contextmenu', function(e) {
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          e.preventDefault();
        }
      });

      // Disable F12 and standard DevTools shortcuts (only in production)
      document.addEventListener('keydown', function(e) {
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          // F12
          if (e.key === 'F12') {
            e.preventDefault();
          }
          // Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+Shift+J
          if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J' || e.key === 'i' || e.key === 'c' || e.key === 'j')) {
            e.preventDefault();
          }
          // Ctrl+U (View Source)
          if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
            e.preventDefault();
          }
        }
      });
    </script>
    <script>
      // Global error handler to catch and display any runtime or resource loading errors on screen
      window.addEventListener('error', function(event) {
        var target = event.target || event.srcElement;
        var isElement = target instanceof HTMLElement;
        var message = isElement ? 'Failed to load resource: ' + (target.src || target.href) : event.message;
        
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.backgroundColor = '#E63030';
        errorDiv.style.color = '#FFFFFF';
        errorDiv.style.padding = '20px';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.fontSize = '14px';
        errorDiv.style.whiteSpace = 'pre-wrap';
        errorDiv.style.boxSizing = 'border-box';
        
        if (isElement) {
          console.warn('[Resource Load Error]:', message);
          return;
        } else {
          var error = event.error || {};
          errorDiv.innerHTML = '<strong>[Runtime Error]:</strong> ' + event.message + '<br><small>in ' + event.filename + ' at line ' + event.lineno + ':' + event.colno + '</small>' + (error.stack ? '<br><br><strong>Stack Trace:</strong><br>' + error.stack : '');
        }
        document.documentElement.appendChild(errorDiv);
      }, true); // capturing phase to catch resource errors
      
      window.addEventListener('unhandledrejection', function(event) {
        var message = event.reason && event.reason.message ? event.reason.message : JSON.stringify(event.reason);
        var stack = event.reason && event.reason.stack ? event.reason.stack : '';
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.backgroundColor = '#E63030';
        errorDiv.style.color = '#FFFFFF';
        errorDiv.style.padding = '20px';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.fontSize = '14px';
        errorDiv.style.whiteSpace = 'pre-wrap';
        errorDiv.style.boxSizing = 'border-box';
        errorDiv.innerHTML = '<strong>[Unhandled Promise Rejection]:</strong> ' + message + (stack ? '<br><br><strong>Stack Trace:</strong><br>' + stack : '');
        document.documentElement.appendChild(errorDiv);
      });
    </script>
